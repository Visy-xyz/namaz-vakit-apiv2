<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Status</title>
  <style>
    :root {
      --bg: #0b0e14; --fg: #e6e9ef; --muted: #8a93a6; --line: #1e2430;
      --ok: #3ddc84; --warn: #f5b942; --bad: #ff5c5c;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f8fa; --fg: #14171f; --muted: #667085; --line: #e3e6eb; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 24px;
    }
    main { text-align: center; }
    h1 {
      margin: 0 0 14px; font-weight: 500; letter-spacing: .01em;
      font-size: clamp(18px, 2.6vw, 22px); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); font-size: 13px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="host">&nbsp;</h1>
    <div class="pill"><span class="dot" id="dot"></span><span id="txt">Checking…</span></div>
    <footer id="year"></footer>
  </main>
  <script>
    document.getElementById('host').textContent = location.hostname;
    document.getElementById('year').textContent = '© ' + new Date().getFullYear();
    fetch('/api/status', { headers: { Accept: 'application/json' } })
      .then(r => r.json())
      .then(s => {
        const dot = document.getElementById('dot'), txt = document.getElementById('txt');
        const ok = s.status === 'ok', warn = s.status === 'expiring';
        dot.className = 'dot ' + (ok ? 'ok' : warn ? 'warn' : 'bad');
        txt.textContent = ok ? 'All systems operational' : warn ? 'Operational — maintenance scheduled' : 'Service degraded';
      })
      .catch(() => {
        document.getElementById('dot').className = 'dot bad';
        document.getElementById('txt').textContent = 'Status unavailable';
      });
  </script>
</body>
</html>
