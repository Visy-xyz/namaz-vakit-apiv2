name: Yearly Prayer Times Refresh

on:
  # Every January 1 at 02:00 UTC
  schedule:
    - cron: '0 2 1 1 *'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prayer times
        env:
          DIYANET_EMAIL: ${{ secrets.DIYANET_EMAIL }}
          DIYANET_PASS: ${{ secrets.DIYANET_PASS }}
        run: |
          if [ -f countries-allv2.json ]; then
            echo "Using scripts/fetch-countries-allv2.mjs (countries-allv2.json present)"
            node scripts/fetch-countries-allv2.mjs --file countries-allv2.json --refetch --delay-ms 1500
          else
            echo "Missing countries-allv2.json"
            exit 1
          fi

      - name: Build prayer catalog
        run: node scripts/build-prayer-catalog.mjs

      - name: Commit new data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh prayer times ${{ github.run_number }}"
          file_pattern: |
            data/**/*.json
            generated/prayer-catalog.json
